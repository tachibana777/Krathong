<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ลอยกระทง</title>
  <meta name="description" content="ลอยกระทงออนไลน์ในโลก ASCII เรืองแสง เลือกกระทง ใส่ชื่อ แล้วลอยไปพร้อมพลุ" />
  <meta name="theme-color" content="#030509" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Mitr:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="scene" aria-label="ฉากลอยกระทงแบบ ASCII"></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <header class="hud">
    <h1 class="title">ลอยกระทง</h1>
    <p class="sub">Loy Krathong Festival</p>
  </header>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <section id="panel" class="panel">
    <div class="step"><span class="num">1</span> เลือกกระทงของคุณ</div>
    <div id="designs" class="designs" role="radiogroup" aria-label="แบบกระทง"></div>
    <form id="form" class="form" autocomplete="off">
      <div class="step"><span class="num">2</span> ใส่ชื่อ แล้วอธิษฐาน</div>
      <div class="row">
        <input id="name" maxlength="24" placeholder="ชื่อของคุณ" required aria-label="ชื่อของคุณ" />
        <input id="wish" maxlength="60" placeholder="คำอธิษฐาน (ไม่บังคับ)" aria-label="คำอธิษฐาน" />
        <button type="submit" id="launch" class="launch">ลอยกระทง <span aria-hidden="true">🪷</span></button>
      </div>
    </form>
  </section>

  <div id="after" class="after hidden">
    <span id="afterText"></span>
    <button id="again" type="button">ลอยอีกกระทง</button>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
